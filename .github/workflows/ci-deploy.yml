name: Mizan Al-Khabar CI & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Editorial Pipeline & Safety Tests
        run: npm test

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
