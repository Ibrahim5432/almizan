name: Mizan Al-Khabar CI & Auto-Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize package versions for public npm registry
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pubVersions = {
              "@google/genai": "^1.0.0",
              "@tailwindcss/vite": "^4.0.0",
              "@vitejs/plugin-react": "^4.3.0",
              "dotenv": "^16.4.0",
              "express": "^4.21.0",
              "lucide-react": "^0.468.0",
              "motion": "^12.0.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "vite": "^6.0.0",
              "vite-plugin-pwa": "^0.21.0",
              "zod": "^3.23.0",
              "@types/node": "^22.0.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@types/express": "^4.17.21",
              "autoprefixer": "^10.4.20",
              "esbuild": "^0.24.0",
              "tailwindcss": "^4.0.0",
              "tsx": "^4.19.0",
              "typescript": "^5.7.0"
            };
            for (const [k, v] of Object.entries(pubVersions)) {
              if (pkg.dependencies && pkg.dependencies[k]) pkg.dependencies[k] = v;
              if (pkg.devDependencies && pkg.devDependencies[k]) pkg.devDependencies[k] = v;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run Editorial Pipeline & Safety Tests
        run: npm test

      - name: Build Production Bundle for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch automatically
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
